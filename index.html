<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Blockchain Simple</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería de Hash SHA256 desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="blockchain.js" defer></script>
</head>
<body>
  <h1>⫘⫘⫘ Proyecto Blockchain HTML/JS ⫘⫘⫘</h1>

  <!-- 🔹 Configuración de usuario -->
  <div class="user-setup">
    <input type="text" id="userInput" placeholder="Ingresa tu nombre de usuario...">
    <button onclick="establecerUsuario()">👤 Establecer Usuario</button>
  </div>

  <div class="container">
    <p id="currentUser">Usuario actual: <b>Invitado</b></p>
    
    <input type="text" id="dataInput" placeholder="Ingresa datos para el bloque...">
    
    <div class="button-row">
      <button type="button" onclick="agregarBloque()">❇️ Agregar Bloque</button>
      <button type="button" onclick="mostrarCadena()">✳️ Mostrar Blockchain</button>
      <button type="button" onclick="verificarCadena()">✅ Verificar Cadena</button>
    </div>
    
    <div class="button-row">
      <button class="hack-btn-inline" onclick="alterarCadena()">💀 Alterar Cadena</button>
      <button class="clear-btn-inline" onclick="limpiarCadena()">🗑️ Limpiar Cadena</button>
    </div>
  </div>
  <div id="output"></div>
</body>
</html>
